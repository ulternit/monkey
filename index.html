<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monkey</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    height: 100%;
    overflow: hidden;
}

/* Fullscreen fixed video */
#bgVideo {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    pointer-events: none; /* prevents clicking pause */
}
</style>




<video id="bgVideo" autoplay="" muted="" loop="" playsinline="" preload="auto">
</video>

<script>
const VIDEO_URL =
"https://raw.githubusercontent.com/ulternit/monkey/main/ssstik.io_%40boogiebug0_1770728974944.mp4";

const video = document.getElementById("bgVideo");
video.src = VIDEO_URL;

/* ---------- Autoplay ---------- */
video.addEventListener("loadeddata", () => {
    video.play().catch(()=>{});
});

/* ---------- Unmute after ANY interaction ---------- */
function enableSound() {
    video.muted = false;
    video.volume = 1;
    video.play().catch(()=>{});
    document.removeEventListener("click", enableSound);
    document.removeEventListener("touchstart", enableSound);
    document.removeEventListener("keydown", enableSound);
}

document.addEventListener("click", enableSound);
document.addEventListener("touchstart", enableSound);
document.addEventListener("keydown", enableSound);

/* ---------- Prevent pausing ---------- */

// instantly resume if paused
video.addEventListener("pause", () => {
    video.play().catch(()=>{});
});

// block keyboard media controls
document.addEventListener("keydown", e => {
    e.preventDefault();
});

// disable right click
document.addEventListener("contextmenu", e => {
    e.preventDefault();
});

// safety watchdog
setInterval(() => {
    if (video.paused) {
        video.play().catch(()=>{});
    }
}, 500);

</script>


<script src="./script.js"></script></body></html>
